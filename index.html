<!DOCTYPE html>
<html>

<head>
    <title>Calculator </title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    
    <div class="calculator">
        <div class="calculator-card">
        <div class="calc-header">
            <span class="brand">PK - CALCULATOR</span>
            <button id="historyToggle" class="icon-btn" title="View History">📜</button>
        </div>
            
        <div id="historyDrawer" class="history-drawer hidden">
            <div class="history-header">
                <span>Recent History</span>
                <button onclick="clearHistory()" class="text-btn">Clear</button>
            </div>
            <ul id="historyList"></ul>
        </div>
        <input class="display" id="display" placeholder="0" >
        <div class="buttons">
            <button onclick="appendToDisplay('(')">(</button>
            <button onclick="appendToDisplay(')')">)</button>
            <button onclick="clearLastElement()">CE</button>
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('/')">/</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')">*</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calculatorResult()">=</button>
            <button onclick="appendToDisplay('+')">+</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
